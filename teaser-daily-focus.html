<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Brainlo — Teaser Daily Focus 60s</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--card:#1a1a28;--border:#2a2a40;--il:#818cf8;--vl:#a78bfa;--text:#e2e8f0;--muted:#94a3b8;--green:#10b981;--amber:#f59e0b;--red:#ef4444;--indigo:#6366f1;--violet:#8b5cf6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);width:1280px;height:720px;overflow:hidden;position:relative}
.pb{position:fixed;bottom:0;left:0;height:3px;background:linear-gradient(90deg,var(--indigo),var(--violet));width:0%;z-index:999;transition:width .15s linear}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .6s ease}
.scene.active{opacity:1;pointer-events:all}
.glow{position:absolute;top:-200px;left:50%;transform:translateX(-50%);width:1000px;height:700px;background:radial-gradient(ellipse,rgba(99,102,241,.18) 0%,transparent 65%);pointer-events:none}

/* keyframes */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
@keyframes slideLeft{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes ringExpand{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes cardRise{from{opacity:0;transform:translateY(35px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* SCENE 1 - CHAOS */
#s1{flex-direction:column}
.ct{font-size:2.8rem;font-weight:800;color:var(--muted);text-align:center;letter-spacing:-.03em;opacity:0;animation:fadeUp .7s ease forwards .3s}
.cs{font-size:1.15rem;color:#4a5568;margin-top:.9rem;text-align:center;opacity:0;animation:fadeUp .7s ease forwards .9s}
.ci-wrap{display:flex;gap:1rem;margin-top:2.5rem;opacity:0;animation:fadeUp .7s ease forwards 1.5s}
.ci{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:.7rem 1.2rem;font-size:.85rem;color:#3d4a5c;display:flex;align-items:center;gap:.5rem}

/* SCENE 2 - LOGO */
#s2{flex-direction:column}
.lr{position:absolute;border-radius:50%;border:1px solid rgba(99,102,241,.2);opacity:0;transform:scale(.4)}
.lr.r1{width:260px;height:260px;border-color:rgba(99,102,241,.22);animation:ringExpand 1.1s ease forwards .1s}
.lr.r2{width:400px;height:400px;border-color:rgba(139,92,246,.13);animation:ringExpand 1.1s ease forwards .3s}
.lr.r3{width:560px;height:560px;border-color:rgba(99,102,241,.07);animation:ringExpand 1.1s ease forwards .5s}
.la{font-size:5rem;font-weight:900;background:linear-gradient(135deg,var(--il),var(--vl));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.04em;position:relative;z-index:2;opacity:0;transform:scale(.7);animation:popIn .65s cubic-bezier(.34,1.56,.64,1) forwards .25s}
.lt{font-size:1.1rem;color:var(--muted);margin-top:1rem;position:relative;z-index:2;opacity:0;animation:fadeUp .6s ease forwards .9s}

/* SCENE 3 - DAILY FOCUS */
#s3{flex-direction:row;gap:4.5rem;align-items:center;padding:2.5rem 4rem}
.ltext{flex:0 0 390px}
.badge{display:inline-block;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.35);color:var(--il);padding:.3rem .9rem;border-radius:999px;font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:0;animation:fadeUp .5s ease forwards .1s}
.ftitle{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:.9rem;opacity:0;animation:fadeUp .55s ease forwards .4s}
.ftitle .g{background:linear-gradient(135deg,var(--il),var(--vl));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.fdesc{color:var(--muted);font-size:.95rem;line-height:1.7;margin-top:1rem;opacity:0;animation:fadeUp .55s ease forwards .75s}
.bullets{margin-top:1.5rem;display:flex;flex-direction:column;gap:.55rem}
.bul{display:flex;align-items:center;gap:.65rem;font-size:.88rem;opacity:0;transform:translateX(-14px)}
.bul .ck{color:var(--green);font-weight:800}
.bul:nth-child(1){animation:slideRight .45s ease forwards 1.05s}
.bul:nth-child(2){animation:slideRight .45s ease forwards 1.25s}
.bul:nth-child(3){animation:slideRight .45s ease forwards 1.45s}
.bul:nth-child(4){animation:slideRight .45s ease forwards 1.65s}

/* FOCUS CARD */
.fcw{flex:0 0 370px;opacity:0;transform:translateY(35px);filter:drop-shadow(0 30px 80px rgba(99,102,241,.32));animation:cardRise .75s cubic-bezier(.22,.61,.36,1) forwards .3s}
.fc{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:1.6rem;position:relative;overflow:hidden}
.fc::before{content:'';position:absolute;inset:0;background:linear-gradient(155deg,rgba(99,102,241,.07),rgba(139,92,246,.04));pointer-events:none}
.fch{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;font-size:.75rem;color:var(--muted)}
.pd{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.fcs{background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.22);border-radius:8px;padding:.6rem .9rem;margin-bottom:.9rem;font-size:.85rem}
.fcs strong{color:var(--il)}
.fct{font-weight:700;font-size:.9rem;margin-bottom:.85rem}
.fci{display:flex;gap:.65rem;align-items:flex-start;padding:.65rem .8rem;border-radius:9px;background:#16161f;border:1px solid var(--border);font-size:.81rem;margin-bottom:.45rem;opacity:0;transform:translateX(18px)}
.fci:nth-child(1){animation:slideLeft .45s ease forwards .9s}
.fci:nth-child(2){animation:slideLeft .45s ease forwards 1.2s}
.fci:nth-child(3){animation:slideLeft .45s ease forwards 1.5s}
.dot{width:9px;height:9px;border-radius:50%;margin-top:3px;flex-shrink:0}
.dr{background:var(--red)}.da{background:var(--amber)}.dg{background:var(--green)}

/* SCENE 4 - CTA */
#s4{flex-direction:column;text-align:center}
.ceye{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--il);opacity:0;animation:fadeUp .5s ease forwards .2s}
.ctit{font-size:3.4rem;font-weight:900;letter-spacing:-.04em;line-height:1.08;margin-top:.8rem;opacity:0;animation:fadeUp .6s ease forwards .5s}
.ctit .g{background:linear-gradient(135deg,var(--il),var(--vl));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.csub{font-size:1.1rem;color:var(--muted);margin-top:1rem;max-width:520px;line-height:1.6;opacity:0;animation:fadeUp .5s ease forwards .85s}
.curl{margin-top:2rem;font-size:1.7rem;font-weight:700;color:var(--muted);opacity:0;animation:fadeUp .6s ease forwards 1.1s}
.curl strong{background:linear-gradient(135deg,var(--il),var(--vl));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.cbadge{margin-top:1.2rem;display:inline-block;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:var(--green);padding:.4rem 1.4rem;border-radius:999px;font-size:.82rem;font-weight:600;opacity:0;animation:fadeUp .5s ease forwards 1.4s}
