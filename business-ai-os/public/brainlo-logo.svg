<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Background pill for icon -->
  <rect x="4" y="4" width="112" height="112" rx="24" ry="24" fill="url(#brandGrad)" />
  <rect x="4" y="4" width="112" height="112" rx="24" ry="24" fill="url(#glowGrad)" />

  <!-- Brain icon (simplified neural/brain shape) -->
  <!-- Left hemisphere -->
  <path d="M38 60 C38 42 50 30 60 30 C65 30 68 34 68 38 C68 34 72 30 78 30 C88 30 98 42 98 60 C98 72 92 80 84 83 C80 85 76 84 74 82 C72 84 68 86 64 86 C60 86 56 84 54 82 C48 82 38 74 38 60 Z"
        fill="white" opacity="0.95" />
  <!-- Brain center line -->
  <line x1="68" y1="32" x2="68" y2="84" stroke="url(#brandGrad)" stroke-width="2" opacity="0.6" />
  <!-- Neural dots -->
  <circle cx="52" cy="48" r="3" fill="white" opacity="0.6" />
  <circle cx="84" cy="48" r="3" fill="white" opacity="0.6" />
  <circle cx="48" cy="64" r="2.5" fill="white" opacity="0.5" />
  <circle cx="88" cy="64" r="2.5" fill="white" opacity="0.5" />
  <circle cx="58" cy="74" r="2" fill="white" opacity="0.4" />
  <circle cx="78" cy="74" r="2" fill="white" opacity="0.4" />
  <!-- Neural connections -->
  <line x1="52" y1="48" x2="68" y2="56" stroke="white" stroke-width="1.5" opacity="0.4" />
  <line x1="84" y1="48" x2="68" y2="56" stroke="white" stroke-width="1.5" opacity="0.4" />
  <line x1="48" y1="64" x2="58" y2="74" stroke="white" stroke-width="1.5" opacity="0.3" />
  <line x1="88" y1="64" x2="78" y2="74" stroke="white" stroke-width="1.5" opacity="0.3" />
  <!-- Center node -->
  <circle cx="68" cy="56" r="4" fill="white" opacity="0.9" />

  <!-- BRAINLO text -->
  <text x="138" y="56" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-1" fill="url(#brandGrad)">BRAIN</text>
  <text x="138" y="98" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="38" font-weight="300" letter-spacing="4" fill="#6366f1" opacity="0.75">lo</text>

  <!-- Tagline -->
  <text x="140" y="113" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="3" fill="#818cf8" opacity="0.8">AI · BUSINESS · OS</text>
</svg>
