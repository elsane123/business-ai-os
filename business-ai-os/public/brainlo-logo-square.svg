  <circle cx="198" cy="210" r="11" fill="white" opacity="0.7" />
  <circle cx="314" cy="210" r="11" fill="white" opacity="0.7" />
  <circle cx="180" cy="268" r="9" fill="white" opacity="0.55" />
  <circle cx="332" cy="268" r="9" fill="white" opacity="0.55" />
  <circle cx="210" cy="312" r="8" fill="white" opacity="0.45" />
