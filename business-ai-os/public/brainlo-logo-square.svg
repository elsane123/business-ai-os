  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)" />
  <rect width="512" height="512" rx="96" ry="96" fill="url(#shine)" />

  <!-- Brain shape centered -->
  <!-- Main brain outline -->
  <path d="M176 256 C176 196 210 148 248 148 C262 148 272 158 272 168 C272 158 282 148 296 148 C334 148 368 196 368 256 C368 296 350 324 326 334 C316 338 306 336 300 330 C294 336 280 342 256 342 C232 342 218 336 212 330 C206 336 196 338 186 334 C162 324 144 296 144 256 Z"
