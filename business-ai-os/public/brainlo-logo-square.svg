  <!-- Neural connections -->
  <line x1="198" y1="210" x2="256" y2="232" stroke="white" stroke-width="4" opacity="0.45" />
  <line x1="314" y1="210" x2="256" y2="232" stroke="white" stroke-width="4" opacity="0.45" />
  <line x1="180" y1="268" x2="210" y2="312" stroke="white" stroke-width="3" opacity="0.35" />
  <line x1="332" y1="268" x2="302" y2="312" stroke="white" stroke-width="3" opacity="0.35" />
  <line x1="256" y1="232" x2="210" y2="312" stroke="white" stroke-width="3" opacity="0.3" />
  <line x1="256" y1="232" x2="302" y2="312" stroke="white" stroke-width="3" opacity="0.3" />

  <!-- BRAINLO text -->
  <text x="256" y="420" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="62" font-weight="800" letter-spacing="-2" fill="white" text-anchor="middle" opacity="0.97">brainlo</text>
